name: Java 21 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java21-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and package
        shell: pwsh
        run: |
          $env:INTRA_PAPER_BUILD_DIR = Join-Path $env:RUNNER_TEMP 'intra-paper-build'
          .\Intra-Paper-System\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: intra-paper-system-${{ github.sha }}
          path: ${{ runner.temp }}\intra-paper-build\intra-paper-system.jar
          if-no-files-found: error
          retention-days: 14
