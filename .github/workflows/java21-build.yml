name: Windows Java 21 offline validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java21-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Microsoft JDK 21
        run: |
          .\.github\scripts\install-microsoft-jdk21.ps1

      - name: Run focused offline suites, build JAR, and verify commit
        id: validate
        run: |
          .\.github\scripts\test-offline-ci.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'intra-paper-ci') `
            -ExpectedCommit $env:GITHUB_SHA

      - name: Upload concise validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-validation-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/intra-paper-ci/logs/
            ${{ runner.temp }}/intra-paper-jdk/install.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified production JAR
        if: success() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: intra-paper-system-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intra-paper-ci/package/intra-paper-system.jar
          if-no-files-found: error
          retention-days: 14
